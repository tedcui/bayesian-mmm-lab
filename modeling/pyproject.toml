[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-lab"
version = "0.1.0"
description = "Bayesian marketing mix modeling lab scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arviz==1.3.0",
    "h5netcdf==1.8.2",
    "h5py==3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pymc==6.4.0",
]

[project.scripts]
mmm-generate-source = "mmm_lab.simulation.generate:main"
mmm-build-mart = "mmm_lab.etl.pipeline:main"
mmm-fit = "mmm_lab.model:main"
mmm-evaluate = "mmm_lab.evaluate:main"
mmm-export = "mmm_lab.export:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "nbclient>=0.11.0",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
