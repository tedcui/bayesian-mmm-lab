[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-lab"
version = "0.1.0"
description = "Bayesian marketing mix modeling lab scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
mmm-generate-source = "mmm_lab.simulation.generate:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "nbclient>=0.11.0",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
